<div class="login-wrapper">
  <div class="login-card">

    <h2 class="login-title">Autentificare</h2>
    <p class="login-subtitle">Introduceți username și parola pentru a continua.</p>

    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">

      <!-- Email -->
      <div class="form-group">
        <label for="email">User Name</label>
        <input
          formControlName="email"
          type="email"
          id="email"
          class="form-input"
          placeholder="Introduceți username"
        />
        <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
           class="error-message">
          Username is required
        </p>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input
          formControlName="password"
          type="password"
          id="password"
          class="form-input"
          placeholder="Introduceți parola"
        />
        <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
           class="error-message">
          Password is required
        </p>
      </div>

      <button
        [disabled]="loginForm.invalid || loginForm.disabled"
        class="form-button"
        type="submit">
        Login
      </button>

    </form>

    <p class="signup-text">
      Don't have an account?
      <a routerLink="../registration" class="signup-link">Sign Up</a>
    </p>

  </div>
</div>
